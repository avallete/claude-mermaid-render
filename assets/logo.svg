<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512">
  <defs>
    <linearGradient id="mrBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FD1C0"/>
      <stop offset="1" stop-color="#1E9C8E"/>
    </linearGradient>
    <linearGradient id="mrTail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F08A65"/>
      <stop offset="1" stop-color="#C95B3C"/>
    </linearGradient>
  </defs>
  <!-- tail: an S-curve ending in a fin made of two flowchart arrowheads -->
  <g class="mr-tail">
    <path d="M74 104 C 66 138, 96 146, 104 160 L 118 160 C 120 140, 136 128, 126 104 Z" fill="url(#mrTail)" stroke="#0E3B44" stroke-width="4" stroke-linejoin="round"/>
    <path d="M86 128 q6 5 12 0 M96 140 q6 5 12 0 M104 118 q6 5 12 0" stroke="#FFD2BF" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>
    <path d="M111 156 L 70 188 Q 90 178 106 186 Z" fill="url(#mrTail)" stroke="#0E3B44" stroke-width="4" stroke-linejoin="round"/>
    <path d="M111 156 L 152 188 Q 132 178 116 186 Z" fill="url(#mrTail)" stroke="#0E3B44" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <!-- arms -->
  <g class="mr-arm-l"><path d="M58 82 q-16 4 -20 18" stroke="#0E3B44" stroke-width="15" stroke-linecap="round" fill="none"/><path d="M58 82 q-16 4 -20 18" stroke="#3CC0AF" stroke-width="7" stroke-linecap="round" fill="none"/></g>
  <g class="mr-arm-r"><path d="M142 82 q16 -4 22 -20" stroke="#0E3B44" stroke-width="15" stroke-linecap="round" fill="none"/><path d="M142 82 q16 -4 22 -20" stroke="#3CC0AF" stroke-width="7" stroke-linecap="round" fill="none"/></g>
  <!-- body: a flowchart node -->
  <rect x="52" y="34" width="96" height="80" rx="26" fill="url(#mrBody)" stroke="#0E3B44" stroke-width="5"/>
  <!-- face -->
  <g class="mr-eyes">
    <ellipse cx="82" cy="70" rx="9" ry="11" fill="#fff"/>
    <ellipse cx="118" cy="70" rx="9" ry="11" fill="#fff"/>
    <circle cx="84" cy="72" r="5" fill="#0E1726"/>
    <circle cx="120" cy="72" r="5" fill="#0E1726"/>
    <circle cx="86" cy="69" r="1.8" fill="#fff"/>
    <circle cx="122" cy="69" r="1.8" fill="#fff"/>
  </g>
  <ellipse cx="70" cy="88" rx="7" ry="4" fill="#FF9C8A" opacity=".7"/>
  <ellipse cx="130" cy="88" rx="7" ry="4" fill="#FF9C8A" opacity=".7"/>
  <path d="M92 90 q8 8 16 0" stroke="#0E1726" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- spark crown -->
  <g class="mr-spark" transform="translate(100 22)">
    <g fill="#F2A65A" stroke="#0E3B44" stroke-width="2.5" stroke-linejoin="round">
      <path d="M0 -16 L4 -4 L16 0 L4 4 L0 16 L-4 4 L-16 0 L-4 -4 Z"/>
    </g>
  </g>
  <!-- little edge connector dots, like node ports -->
  <circle cx="52" cy="74" r="4" fill="#0E3B44"/>
  <circle cx="148" cy="74" r="4" fill="#0E3B44"/>
</svg>
